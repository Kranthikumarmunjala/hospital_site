{% extends 'patients/base.html' %}
{% block content %}
<div class="card shadow p-5 border-0 text-center" style="max-width: 600px; margin: 40px auto;">
    <h3 class="fw-bold mb-4 text-primary">📄 Upload Patient Document</h3>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-4 text-start">
            <label class="form-label fw-bold">Select File (Word .docx or PDF):</label>
            <input type="file" name="document" class="form-control form-control-lg" accept=".docx, .pdf" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Upload & View Form</button>
    </form>
    
    <div class="mt-4">
        <a href="{% url 'patient_list' %}" class="text-decoration-none">👉 View All Patients List</a>
    </div>
</div>
{% endblock %}
