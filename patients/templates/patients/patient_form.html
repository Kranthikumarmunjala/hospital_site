{% extends 'patients/base.html' %}
{% block content %}
<div class="card shadow p-4">
    <h3 class="text-primary mb-3">Add New Patient</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Submit Patient Details</button>
        <a href="{% url 'patient_list' %}" class="btn btn-secondary">View List</a>
    </form>
</div>
{% endblock %}
