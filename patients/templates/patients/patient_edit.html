{% extends 'patients/base.html' %}
{% block content %}
<div class="card shadow p-4">
    <h3 class="text-warning mb-3">Edit Patient & Digital Signature</h3>
    
    <form method="POST" id="editForm">
        {% csrf_token %}
        {{ form.as_p }}

        <label class="form-label"><strong>Patient Signature (ల్యాప్‌టాప్‌లో మౌస్ తో / మొబైల్‌లో చేతితో గీయండి):</strong></label>
        <div style="border: 2px dashed #0d6efd; background-color: #fff; width: 100%; max-width: 400px; height: 180px; position: relative;">
            <canvas id="signature-pad" style="width: 100%; height: 100%; touch-action: none;"></canvas>
        </div>
        
        <button type="button" class="btn btn-sm btn-outline-danger mt-2" id="clearBtn">Clear Signature</button>
        <input type="hidden" name="signature_data" id="signature_data">

        {% if patient.signature_data %}
        <div class="mt-3">
            <p class="mb-1 text-muted">ప్రస్తుతం ఉన్న సంతకం:</p>
            <img src="{{ patient.signature_data }}" style="border: 1px solid #ccc; max-width: 200px; height: 80px;" alt="Signature">
        </div>
        {% endif %}

        <hr>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'patient_list' %}" class="btn btn-secondary">Back to List</a>
    </form>
</div>

<!-- Signature Pad Script -->
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script>
    const canvas = document.getElementById('signature-pad');
    
    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    const signaturePad = new SignaturePad(canvas, {
        backgroundColor: 'rgba(255, 255, 255, 0)',
        penColor: 'rgb(0, 0, 0)'
    });

    document.getElementById('clearBtn').addEventListener('click', function () {
        signaturePad.clear();
    });

    document.getElementById('editForm').addEventListener('submit', function (e) {
        if (!signaturePad.isEmpty()) {
            document.getElementById('signature_data').value = signaturePad.toDataURL();
        }
    });
</script>
{% endblock %}
